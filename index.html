<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1b0a27" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>ルルとおしゃべり</title>
  </head>
  <body>
    <main class="app" aria-live="polite">
      <div class="stars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>

      <header class="topbar">
        <span class="online-dot"></span>
        <span>ルルのおへや</span>
        <button id="parentInfo" class="info-button" type="button" aria-label="おうちの人への説明">i</button>
      </header>

      <section class="stage">
        <div id="aura" class="aura"></div>
        <img id="lulu" class="lulu" src="/lulu.png" alt="オリジナルキャラクターのルル" />
        <div id="soundWaves" class="sound-waves" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </section>

      <section class="talk-card">
        <p id="status" class="status">ルルに でんわしてみよう！</p>
        <p id="hint" class="hint">おうちの人といっしょに、ボタンをおしてね</p>

        <div class="controls">
          <button id="muteButton" class="round-button secondary" type="button" aria-label="マイクをおやすみ" hidden>
            <span id="muteIcon">🎙️</span>
          </button>
          <button id="callButton" class="call-button" type="button">
            <span id="callIcon">☎</span>
            <span id="callLabel">ルルに でんわ</span>
          </button>
        </div>
      </section>

      <p class="privacy-note">なまえ・おうち・でんわばんごうは いわないでね</p>
    </main>

    <dialog id="parentDialog">
      <div class="dialog-card">
        <h2>おうちの方へ</h2>
        <p>これは非公式のオリジナルAIキャラクターです。音声と会話内容は ElevenLabs と利用中のAIサービスで処理・保存される場合があります。個人情報を話さず、保護者の見守りのもとでお使いください。</p>
        <button id="closeDialog" type="button">わかりました</button>
      </div>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
